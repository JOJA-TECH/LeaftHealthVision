[project]
name = "leafthealthvision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jesus-MMM", email = "jesusmanuelmercadomachado@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "codecarbon>=3.3.2",
    "datasets==4.0.0",
    "matplotlib==3.10.9",
    "mlflow==3.18.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "notebook>=7.6.5",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "scikit-learn==1.7.2",
    "tensorflow==2.21.0",
]

[project.scripts]
leafthealthvision = "leafthealthvision:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
